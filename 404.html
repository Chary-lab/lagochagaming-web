<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Página no encontrada | LaGochaGaming</title>
    <meta name="theme-color" content="#ff66b2">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.35.1">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="181add5a-5f78-4d10-a199-4d2460d443a8" data-domains="lagochagaming.com"></script>
</head>
<body class="error-page">
    <main class="error-404">
        <a class="logo" href="/">LAGOCHA<span>GAMING</span></a>
        <img class="error-illustration" src="img/mcchary/404.webp" alt="Capibara de McChary revisando un error 404" width="280" height="210" loading="lazy" decoding="async">
        <p class="error-code">404</p>
        <h1>Esta página no existe</h1>
        <p class="error-text">Puede que el enlace esté roto o que la página haya cambiado de sitio.</p>
        <div class="error-actions">
            <a class="btn-primary" href="/">Volver al inicio</a>
            <a class="btn-primary btn-muted" href="/comunidad">Ir a la comunidad</a>
        </div>
    </main>
    <script>
        try {
            const tema = localStorage.getItem('gochi_tema');
            if (tema === 'light') document.body.classList.add('light-mode');
            else if (tema === 'oled') document.body.classList.add('oled-mode');
        } catch (e) { /* sin localStorage */ }
    </script>
</body>
</html>
