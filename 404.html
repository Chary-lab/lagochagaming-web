    <script>
        try {
            const tema = localStorage.getItem('gochi_tema');
            if (tema === 'light') document.body.classList.add('light-mode');
            else if (tema === 'oled') document.body.classList.add('oled-mode');
        } catch (e) { /* sin localStorage */ }
        try {
            var aj = JSON.parse(localStorage.getItem('gochi_ajustes') || '{}');
            var rr = document.documentElement;
            if (aj.animaciones === false) rr.classList.add('sin-animaciones');
            if (aj.texto === 90 || aj.texto === 110 || aj.texto === 125) rr.classList.add('texto-' + aj.texto);
            if (aj.densidad === 'compacta') rr.classList.add('densidad-compacta');
            if (aj.transparencias === false) rr.classList.add('sin-transparencias');
            if (aj.contraste === true) rr.classList.add('alto-contraste');
        } catch (e) { /* sin localStorage */ }
    </script>
